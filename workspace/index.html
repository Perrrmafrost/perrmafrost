<title>The Package Production Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --warm:#C08A4E; --warm-dim:#8A6438; --cold:#8FA6B8; --cold-dim:#5C7285;
  --ok:#6E8F6B; --bad:#B4553F; --hold:#9A8654;
  --bg:#EAECEE; --bg-2:#F5F6F7; --panel:#FFFFFF; --rail:#E2E5E8;
  --line:#CBD1D6; --line-soft:#DEE3E7;
  --tx:#16191C; --tx-2:#4A525A; --tx-3:#79838C;
  --shadow:0 1px 2px rgba(16,20,24,.06),0 8px 24px rgba(16,20,24,.06);
  --mono:"Courier Prime",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1113; --bg-2:#14181B; --panel:#171C20; --rail:#101417;
  --line:#2A3238; --line-soft:#212930;
  --tx:#E4E8EB; --tx-2:#A2ADB5; --tx-3:#6E7A83;
  --warm:#D6A165; --warm-dim:#A2764A; --cold:#A6BCCD; --cold-dim:#7791A5;
  --ok:#85A882; --bad:#CE6E56; --hold:#B6A06A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0E1113; --bg-2:#14181B; --panel:#171C20; --rail:#101417;
  --line:#2A3238; --line-soft:#212930;
  --tx:#E4E8EB; --tx-2:#A2ADB5; --tx-3:#6E7A83;
  --warm:#D6A165; --warm-dim:#A2764A; --cold:#A6BCCD; --cold-dim:#7791A5;
  --ok:#85A882; --bad:#CE6E56; --hold:#B6A06A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
     font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--cold-dim)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);
      display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand .ttl{font-size:11px;letter-spacing:.22em;font-weight:600;color:var(--tx-2);line-height:1.5}
.brand .ep{font-family:var(--mono);font-size:12px;color:var(--warm);margin-top:6px}
.navgrp{padding:14px 10px 2px}
.navgrp>span{display:block;padding:0 8px 6px;font-size:10px;letter-spacing:.18em;
             color:var(--tx-3);font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:none;border:0;text-align:left;padding:7px 10px;border-radius:var(--r);
  cursor:pointer;color:var(--tx-2);font-size:13px;width:100%}
.nav button:hover{background:var(--line-soft);color:var(--tx)}
.nav button[aria-current="true"]{background:var(--panel);color:var(--tx);
  box-shadow:inset 2px 0 0 var(--warm);font-weight:500}
.nav .ct{font-family:var(--mono);font-size:11px;color:var(--tx-3)}
.railfoot{margin-top:auto;padding:14px;border-top:1px solid var(--line);
          display:flex;gap:8px;align-items:center}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:5px 9px;cursor:pointer;font-size:11px;color:var(--tx-2)}

.main{min-width:0;display:flex;flex-direction:column}
.status{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);
        background:var(--bg-2);position:sticky;top:0;z-index:20}
.status div{padding:9px 16px;border-right:1px solid var(--line-soft);
            font-size:11px;color:var(--tx-3);letter-spacing:.06em}
.status b{display:block;font-family:var(--mono);font-size:13px;color:var(--tx);
          letter-spacing:0;font-weight:400;font-variant-numeric:tabular-nums}
.status .ok b{color:var(--ok)}
.wrap{padding:26px 30px 70px;max-width:1240px}
.view{display:none}.view.on{display:block}

.ph{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ph .k{font-size:10px;letter-spacing:.2em;color:var(--warm);font-weight:600}
.ph h2{font-size:25px;margin:4px 0 6px;font-weight:500;letter-spacing:-.02em}
.ph p{color:var(--tx-2);max-width:64ch;margin:0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{font-size:12px;letter-spacing:.12em;color:var(--tx-3);font-weight:600;margin-bottom:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .lb{font-size:10px;letter-spacing:.16em;color:var(--tx-3);font-weight:600}
.tile .vl{font-family:var(--mono);font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .sb{font-size:11px;color:var(--tx-3);margin-top:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--tx-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;
  padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--tx-2);font-weight:600}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.hold{color:var(--hold);border-color:color-mix(in srgb,var(--hold) 45%,transparent)}
.pill.cold{color:var(--cold-dim);border-color:color-mix(in srgb,var(--cold) 45%,transparent)}
.pill.warm{color:var(--warm-dim);border-color:color-mix(in srgb,var(--warm) 45%,transparent)}

.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.14em;color:var(--tx-3);font-weight:600;
   padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
   position:sticky;top:0;background:var(--panel)}
td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.m{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--tx-2)}
.scroll{max-height:560px;overflow:auto}

.actbar{display:flex;height:26px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.actbar div{position:relative;font-size:9.5px;letter-spacing:.1em;color:#0E1113;
  display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}

input[type=search],input[type=text],select{background:var(--bg-2);border:1px solid var(--line);
  color:var(--tx);border-radius:var(--r);padding:7px 10px;font-family:var(--sans);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
     padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--tx-2)}
.btn:hover{border-color:var(--warm);color:var(--tx)}
.btn.on{background:var(--warm);border-color:var(--warm);color:#16130E;font-weight:600}

/* ---------- previs frame ---------- */
.stage{background:#000;border:1px solid var(--line);border-radius:var(--r);
       position:relative;overflow:hidden;aspect-ratio:2/1}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
     justify-content:space-between;padding:12px 16px}
.ovl .top{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);
          font-size:11px;color:rgba(233,238,242,.62);text-shadow:0 1px 3px #000}
.ovl .bot{text-align:center;padding-bottom:4px}
.ovl .dlg{display:inline-block;font-size:15px;color:#F0F3F6;text-shadow:0 2px 6px #000;
          max-width:78%;line-height:1.35}
.ovl .dlg b{color:var(--warm);font-weight:600;font-size:11px;letter-spacing:.14em;
            display:block;margin-bottom:2px}
.cdw{position:absolute;right:16px;bottom:14px;font-family:var(--mono);font-size:15px;
     color:#C8D4DE;letter-spacing:.1em;text-shadow:0 0 12px rgba(140,180,210,.5)}
.slate{position:absolute;left:0;right:0;top:0;height:100%;display:flex;align-items:center;
       justify-content:center;flex-direction:column;gap:8px;background:#000}
.slate .t1{font-size:20px;letter-spacing:.42em;color:#EEF1F4;font-weight:300}
.slate .t2{font-size:10px;letter-spacing:.3em;color:#7a838c}

.transport{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    width:36px;height:32px;cursor:pointer;display:grid;place-items:center}
.tp:hover{border-color:var(--warm)}
.scrub{flex:1;min-width:220px;height:32px;position:relative;cursor:pointer;
       background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scrub .acts{position:absolute;inset:0;display:flex}
.scrub .acts i{height:100%;opacity:.42}
.scrub .pg{position:absolute;top:0;bottom:0;width:2px;background:var(--warm);
           box-shadow:0 0 8px var(--warm)}
.scrub .cdz{position:absolute;top:0;bottom:0;border-left:1px dashed var(--cold);opacity:.7}
.tcread{font-family:var(--mono);font-size:14px;min-width:118px;text-align:right;
        font-variant-numeric:tabular-nums}

.shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:0;cursor:pointer;overflow:hidden;text-align:left;display:block}
.sc:hover{border-color:var(--warm)}
.sc.on{border-color:var(--warm);box-shadow:0 0 0 1px var(--warm)}
.sc .th{aspect-ratio:2/1;background:#000;position:relative}
.sc .mt{padding:6px 8px;font-size:10.5px;line-height:1.4}
.sc .mt .id{font-family:var(--mono);color:var(--tx-3);display:flex;justify-content:space-between}
.sc .mt .fr{color:var(--tx-2);margin-top:1px}

.scenehead{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;
           padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.scenehead h3{font-size:13px;font-family:var(--mono);color:var(--tx);font-weight:400}
.scenehead .s{font-size:10px;letter-spacing:.14em;color:var(--tx-3);margin-left:auto}

pre{font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;
    margin:0;color:var(--tx-2)}
.script{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:22px 26px;max-height:640px;overflow:auto}
.script b{color:var(--tx);font-weight:700}

.tracks{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.trow{display:grid;grid-template-columns:96px 1fr;border-bottom:1px solid var(--line-soft)}
.trow:last-child{border-bottom:0}
.trow>.lb{padding:8px 10px;font-size:10px;letter-spacing:.12em;color:var(--tx-3);
          border-right:1px solid var(--line-soft);font-weight:600;background:var(--bg-2)}
.tlane{position:relative;height:34px;overflow:hidden}
.tlane i{position:absolute;top:5px;bottom:5px;border-radius:1px;font-size:9px;
         font-family:var(--mono);color:#0E1113;display:flex;align-items:center;
         padding-left:3px;overflow:hidden;white-space:nowrap}
.note{border-left:2px solid var(--warm);padding:9px 0 9px 13px;color:var(--tx-2);
      background:linear-gradient(90deg,color-mix(in srgb,var(--warm) 8%,transparent),transparent);
      margin:10px 0;font-size:13px}
.warn{border-left-color:var(--bad);
      background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 9%,transparent),transparent)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:2px 14px;font-size:13px}
.dl dt{color:var(--tx-3);font-size:11px;letter-spacing:.08em;padding-top:3px}
.dl dd{margin:0;color:var(--tx-2)}
.copy{float:right;font-size:10px;padding:3px 8px;background:var(--bg-2);
      border:1px solid var(--line);border-radius:2px;cursor:pointer;color:var(--tx-3)}
.prompt{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--tx-2);
        background:var(--bg-2);border:1px solid var(--line-soft);border-radius:2px;
        padding:10px 12px;max-height:190px;overflow:auto;white-space:pre-wrap}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  #v-gen .grid[style*="300px"]{grid-template-columns:1fr!important}
  .status div{padding:7px 12px}
  .rail{position:static;height:auto;flex-direction:column}
  .wrap{padding:18px 16px 60px}
}
</style>

mp.\n\n<b>MILES</b>\nWhat?\n\n<b>LAUREN</b>\nIt turned on. In our kitchen. In the middle of the night. And you didn&#x27;t jump.\n\nBeat.\n\n<b>LAUREN (CONT&#x27;D)</b>\nI jumped. The smoke alarm made me jump. That thing opened an eye at me and you stood there like you were reading a bill.\n\n<b>MILES</b>\nI&#x27;m putting it in the car.\n\n<b>LAUREN</b>\nNo.\n\n<b>MILES</b>\nLauren\u2014\n\n<b>LAUREN</b>\nNo.\n\nShe does not raise her voice. She puts one hand flat on the pane and leaves it there and looks at him.\n\nHe could move her. They both know he could move her. He doesn&#x27;t.\n\n<b>MILES</b>\nWe agreed.\n\n<b>LAUREN</b>\nWe didn&#x27;t agree to this.\n\n<b>MILES</b>\nWe agreed that if anything ever came near us we don&#x27;t pick it up, we don&#x27;t turn it over, we don&#x27;t keep it in the *house*\u2014\n\n<b>LAUREN</b>\nThat is not what we agreed.\n\n<b>MILES</b>\nIt is *exactly*\u2014\n\n<b>LAUREN</b>\nWe agreed we wouldn&#x27;t go looking!\n\nThat does land. That is louder.\n\n<b>LAUREN (CONT&#x27;D)</b>\n(back down, immediately)\nNobody ever said what to do when it comes to the door.\n\nThe refrigerator. The rain.\n\n<b>MILES</b>\n(quiet)\nDon&#x27;t be found.\n\n<b>LAUREN</b>\nDon&#x27;t be found. Don&#x27;t be recorded. Don&#x27;t go back. Don&#x27;t answer. Don&#x27;t send anything forward.\n\nShe says it flat and fast, without effort, the way you say something you have said ten thousand times.\n\n<b>LAUREN (CONT&#x27;D)</b>\nI know them, Miles. I say them at three in the morning. In order. Every night. Have done for six years.\n\n<b>MILES</b>\n(something crosses him)\nSix years.\n\n<b>LAUREN</b>\nSix years and four months and we have not said one word about any of it out loud in this house and I have *kept* that. I kept it because you asked me to.\n\nShe takes her hand off the pane.\n\n<b>LAUREN (CONT&#x27;D)</b>\nSo don&#x27;t tell me what we agreed.\n\nShe picks the leaf up. Both hands, careful, like a tray.\n\n<b>MILES</b>\nWhere are you going.\n\n<b>LAUREN</b>\nI&#x27;m putting it on the table where we can see it.\n\n<b>MILES</b>\nDon&#x27;t put it down.\n\n<b>INT. WARD HOUSE \u2014 LIVING ROOM \u2014 CONTINUOUS</b>\n\nShe puts it down.\n\nFlat on the coffee table, dead centre. She sits back on the couch. Miles stays standing in the doorway, which is exactly between Lauren and the front hall, and he does not appear to know he has done that.\n\nThe television is still on, sound low. The old film. Nobody is watching it.\n\nNothing happens.\n\nNothing keeps happening.\n\nLauren pulls a cushion into her lap. Miles shifts his weight.\n\n<b>MILES</b>\nThis is\u2014\n\n<b>THE LEAF WAKES.</b>\n\nNo sound. No boot. No logo. The light simply arrives, and it is on their faces.\n\nMiles goes silent mid-word.\n\n<b>ON THE PANE:</b>\n\nA FACE, in darkness. Lit from somewhere low and moving, so that the light shifts across it slowly, as if from water, or a fire, or a screen we can&#x27;t see.\n\nIt is LAUREN&#x27;S FACE.\n\nThe same age. The same eyes. The same mouth.\n\nHer hair is down and unstyled. Something dark and high-necked at her throat.\n\nThere is a fine pale scar under her left eye, running back along the cheekbone. Old. Well healed.\n\nShe is absolutely still.\n\nLauren does not move. Neither does Miles.\n\n<b>DOUBLE (V.O.)</b>\nLauren.\n\nIt is Lauren&#x27;s voice.\n\nFlatter. Slower. No smile in it at all. And she does not take a breath before she speaks.\n\nLauren&#x27;s hand has gone to her own mouth without her deciding to do it.\n\n<b>DOUBLE (CONT&#x27;D)</b>\nI know. Take a second.\n\n<b>LAUREN</b>\n(barely)\nWhat is this.\n\n<b>DOUBLE</b>\nYou have a burn on the inside of your left wrist. Two inches, curved. You got it on a stove that isn&#x27;t in this house.\n\nLauren&#x27;s other hand closes over her left wrist.\n\n<b>DOUBLE (CONT&#x27;D)</b>\nYou still say them at three in the morning.\n\nBeat.\n\n<b>DOUBLE (CONT&#x27;D)</b>\nIn order.\n\nLauren makes a sound. Not a word.\n\nMiles takes one step into the room.\n\n<b>MILES</b>\nWho is this.\n\nThe face does not answer him.\n\nBut she is looking at him.\n\nShe has been looking at him this entire time.\n\n<b>DOUBLE</b>\n(to Lauren)\nYou&#x27;ve been here too long.\n\n<b>LAUREN</b>\nWhat?\n\n<b>DOUBLE</b>\nIt was supposed to be short. Somewhere to be, for a while.\n\n(beat)\n\nSix years isn&#x27;t a while. It&#x27;s started to hold.\n\n<b>MILES</b>\nHold\u2014\n\n<b>DOUBLE</b>\n(to Lauren, over him)\nThere&#x27;s a correction. I don&#x27;t know how far out it is. I don&#x27;t think it&#x27;s far.\n\n<b>LAUREN</b>\nA correction of what?\n\n<b>DOUBLE</b>\nOf the part where you stayed.\n\nSilence.\n\nMiles crosses the room. Fast. He gets one hand on the pane\u2014\n\n\u2014and stops. Because his hand is on it and nothing changes. The face keeps talking. He might as well have put his hand on a wall.\n\n<b>DOUBLE (CONT&#x27;D)</b>\nLauren, listen. There&#x27;s a thing you need to not do, and I need you to hear it from me, because you won&#x27;t hear it from\u2014\n\n<b>LAUREN</b>\nHow do you have my face?\n\nFor the first time, the face hesitates.\n\nIt is a small thing. Half a second. But it is the first human beat she has had, and it is horrible, because it means she is deciding what to say.\n\n<b>DOUBLE</b>\nBecause I\u2014\n\n<b>STATIC.</b>\n\nThe pane tears open into FOOTAGE:\n\n<b>INSERT \u2014 THE FOOTAGE</b>\n\nThree seconds. Handheld, degraded, the wrong shape \u2014 narrower, older, like something recovered rather than filmed.\n\nNIGHT. Outdoors. Hard rain in a hard light.\n\nMILES and LAUREN. Older. Not much. Enough.\n\nThey are moving fast \u2014 not running, *escorting*, one of them holding the other up. Miles has blood in his hairline and down the side of his face.\n\nBehind them, badly out of focus, high up: a SIGN. Sodium yellow. Half a word legible.\n\nSomebody off-frame is shouting. A name. It is not &quot;Miles&quot; and it is not &quot;Lauren.&quot;\n\n<b>BACK TO SCENE</b>\n\n<b>BLACK.</b>\n\nThe pane is dead. The room is dark except for the television, still playing its old film to nobody.\n\nNeither of them moves.\n\n<b>LAUREN</b>\nThere was a sign.\n\n<b>MILES</b>\nThere wasn&#x27;t.\n\n<b>LAUREN</b>\nBehind us. Yellow. Up high.\n\n<b>MILES</b>\nLauren, it was three seconds of\u2014\n\n<b>LAUREN</b>\nThere was a *sign*, Miles.\n\nShe turns and looks at him properly for the first time since it started.\n\n<b>LAUREN (CONT&#x27;D)</b>\nAnd you saw it. Because you stopped breathing.\n\nHe doesn&#x27;t answer.\n\nHe doesn&#x27;t answer for a long time.\n\nRain on the window. The film ends and the credits start rolling, silently, on a television nobody is watching.\n\n<b>CHIRP.</b>\n\nCUT TO BLACK \u2014 and total silence.\n\n<span style=\"color:var(--line)\">\u2014 \u2014 \u2014</span>\n\n<b style=\"display:block;margin:26px 0 6px;letter-spacing:.14em\">ACT THREE \u2014 &quot;RULES WE BROKE&quot;</b>\n\n<b>INT. WARD HOUSE \u2014 VARIOUS \u2014 NIGHT</b>\n\nNo music. Almost no sound. Just a man working.\n\nMiles slides the pane face-down into the bottom drawer of the sideboard and shuts it.\n\nHe stands there. Then he reaches out and touches the brass drawer pull.\n\nIt is cold.\n\nHe takes his hand back.\n\n\u2014\n\nHe puts it in the camping cooler. Clips the lid. Stands back.\n\nThen, slowly, he puts his palm on the lid of the cooler.\n\nIt is warm.\n\n\u2014\n\nHe goes to the breaker panel in the hall closet and throws the main.\n\nThe house dies. Refrigerator, television, the lamp in the hall, all of it, gone at once.\n\nHe comes back to the living room in the dark.\n\nThe pane is lying on the coffee table where Lauren has put it back.\n\nIt is glowing.\n\n<b>EXT. CEDAR ROW \u2014 NIGHT</b>\n\nWide. The street.\n\nEvery house has its lights on except one.\n\nA dog barks twice, somewhere. A television flickers blue through a window. Two doors down, the party is still going: laughter, a car door, somebody calling somebody else an idiot with enormous affection.\n\nThe world is completely, insultingly fine.\n\n<b>INT. WARD HOUSE \u2014 LIVING ROOM \u2014 NIGHT</b>\n\nPower back on. One lamp.\n\nLauren sits in the armchair, facing the coffee table. She has put Miles&#x27;s canvas jacket over the pane.\n\nShe has not moved in a while.\n\nMiles comes in and stands.\n\n<b>MILES</b>\nI know what it is.\n\nShe doesn&#x27;t look up.\n\n<b>MILES (CONT&#x27;D)</b>\nNot who sent it. I don&#x27;t know that. But I know what it is.\n\n<b>LAUREN</b>\nYou&#x27;ve seen one.\n\n<b>MILES</b>\nI&#x27;ve held one.\n\n<b>LAUREN</b>\nWhen?\n\nHe doesn&#x27;t answer.\n\n<b>LAUREN (CONT&#x27;D)</b>\nOkay.\n\nShe is not being generous. She is filing it.\n\n<b>LAUREN (CONT&#x27;D)</b>\nThen here&#x27;s the one I actually want.\n\nShe looks up.\n\n<b>LAUREN (CONT&#x27;D)</b>\nWhy me? It knows my wrist. It knows what I do at three in the morning. It&#x27;s got my *face*, Miles. Why does it want me and not you?\n\nMiles opens his mouth.\n\nNothing comes out.\n\nLauren watches his hands go flat on the back of the couch.\n\nShe has seen that before too.\n\nShe gets up.\n\n<b>MILES</b>\nWhere are you\u2014\n\nShe crosses to the table, lifts the jacket, and takes the label out from under the pane where she left it.\n\nShe reads it.\n\nThen she walks out of the room.\n\n<b>INT. WARD HOUSE \u2014 KITCHEN \u2014 CONTINUOUS</b>\n\nLauren stops in front of the wall calendar.\n\nThe circled date. Blue pen. Nothing written in it.\n\nShe looks down at the label in her hand.\n\nShe looks up at the calendar.\n\nShe stands there a long time.\n\n<b>INT. WARD HOUSE \u2014 LIVING ROOM \u2014 CONTINUOUS</b>\n\nShe comes back in with the label held up between two fingers.\n\n<b>LAUREN</b>\nWhat happens on the fourteenth.\n\n<b>MILES</b>\nNothing.\n\n<b>LAUREN</b>\nIt&#x27;s on the box, Miles. It&#x27;s the consignment date. And it&#x27;s the one day of the year you circle on a calendar and don&#x27;t write anything in.\n\nSilence.\n\n<b>LAUREN (CONT&#x27;D)</b>\nSix years I&#x27;ve watched you circle that. I never asked. I decided it was \u2014 I decided it was somebody&#x27;s birthday, and that you&#x27;d tell me when you could.\n\nShe lowers the label.\n\n<b>LAUREN (CONT&#x27;D)</b>\nSo tell me when you can.\n\nMiles sits down on the arm of the couch. It takes him a moment to do it.\n\n<b>MILES</b>\nOnce a year.\n\n<b>LAUREN</b>\nOnce a year what.\n\n<b>MILES</b>\nI send nine words.\n\nThe room is very quiet.\n\n<b>LAUREN</b>\nYou send.\n\n<b>MILES</b>\nYes.\n\n<b>LAUREN</b>\nForward.\n\n<b>MILES</b>\nYes.\n\n<b>LAUREN</b>\nThat&#x27;s five.\n\n<b>MILES</b>\nI know what it is.\n\n<b>LAUREN</b>\nSay it.\n\n<b>MILES</b>\nThat&#x27;s clause five.\n\n<b>LAUREN</b>\n(quietly)\nHow many times.\n\n<b>MILES</b>\nSix.\n\nLauren turns away from him. All the way around, hands on top of her head, looking at nothing.\n\n<b>LAUREN</b>\nWhat are the nine words.\n\n<b>MILES</b>\nLauren\u2014\n\n<b>LAUREN</b>\nWhat are the nine words, Miles.\n\nBeat.\n\n<b>MILES</b>\n&quot;We&#x27;re still here. We&#x27;re okay. Don&#x27;t come. I&#x27;m sorry.&quot;\n\nShe turns back.\n\n<b>LAUREN</b>\nWho&#x27;s &quot;I&#x27;m sorry&quot; for?\n\nHe doesn&#x27;t answer.\n\n<b>LAUREN (CONT&#x27;D)</b>\nWho is it for?\n\n<b>MILES</b>\nThere&#x27;s somebody who thinks we didn&#x27;t make it.\n\n<b>LAUREN</b>\nWho.\n\n<b>MILES</b>\nLauren.\n\n<b>LAUREN</b>\n*Who?*\n\nHe can&#x27;t. He physically cannot get it out. His mouth works and nothing comes.\n\nAnd Lauren \u2014 watching him fail \u2014 understands something and goes absolutely still.\n\n<b>LAUREN (CONT&#x27;D)</b>\nOh.\n\nShe looks down at the label in her hand. At the crossed seven. At the date.\n\n<b>LAUREN (CONT&#x27;D)</b>\nMiles.\n\n(beat)\n\nYou didn&#x27;t get a package.\n\n<b>MILES</b>\nDon&#x27;t.\n\n<b>LAUREN</b>\nYou got an answer.\n\n<b>MILES</b>\nLauren\u2014\n\n<b>LAUREN</b>\nYOU PUT OUR ADDRESS IN THE AIR ONCE A YEAR FOR SIX YEARS AND LET ME THINK I WAS SAFE!\n\nIt rips out of her. It is the loudest thing in this house in six years and it is over in two seconds and the silence afterward is enormous.\n\nMiles has not moved.\n\n<b>MILES</b>\n(low)\nIt&#x27;s nine words. There&#x27;s no address in it. There&#x27;s no\u2014\n\n<b>LAUREN</b>\nThere&#x27;s a *when*.\n\nThat stops him.\n\n<b>LAUREN (CONT&#x27;D)</b>\nEvery year. Same day. Same time, I&#x27;d bet. You didn&#x27;t tell them where we are. You told them we&#x27;re *regular*.\n\nMiles puts his hand over his mouth and holds it there.\n\n<b>LAUREN (CONT&#x27;D)</b>\nThey didn&#x27;t find us. You waved.\n\nLong silence.\n\n<b>MILES</b>\nThey told us nobody would come looking.\n\n<b>LAUREN</b>\nThey told us a lot of things.\n\n<b>MILES</b>\nThey said the whole point \u2014 the entire point, Lauren, the reason for all of it, the reason we don&#x27;t have photographs and I check a street I have checked eleven thousand times \u2014 was that if we did it properly, nobody would ever have to come.\n\n<b>LAUREN</b>\nAnd you did it properly.\n\n<b>MILES</b>\n(a wreck)\nI did it properly for three hundred and sixty-four days a year.\n\n<b>LAUREN</b>\nYeah.\n\nShe sits down on the coffee table, right beside the covered pane, because her legs have stopped being interested.\n\n<b>LAUREN (CONT&#x27;D)</b>\nI&#x27;m not angry that you lied.\n\n<b>MILES</b>\nYou are.\n\n<b>LAUREN</b>\nI&#x27;m a *little* angry that you lied.\n\nAlmost \u2014 almost \u2014 the ghost of the two people from the beginning of the evening.\n\nThen it&#x27;s gone.\n\n<b>LAUREN (CONT&#x27;D)</b>\nYou didn&#x27;t protect me, Miles.\n\n(beat)\n\nYou just made sure that when it came, I&#x27;d be the one who was surprised.\n\nHe has no answer to that. There isn&#x27;t one.\n\nThe lamp flickers \u2014 no. Not flickers. The room has just got *colder*. You can see it: her breath isn&#x27;t visible, but her arms come in.\n\nShe gets up, takes a grey cardigan off the back of the chair, and pulls it on.\n\n<b>MILES</b>\nIt does that.\n\n<b>LAUREN</b>\nDoes what.\n\n<b>MILES</b>\nWhen it&#x27;s about to.\n\nShe looks at him. Six years of not asking, and now every single answer is a new injury.\n\n<b>MILES (CONT&#x27;D)</b>\nLauren.\n\n<b>LAUREN</b>\nDon&#x27;t.\n\n<b>MILES</b>\nLauren.\n\nShe stops.\n\nHe comes over. He doesn&#x27;t touch her. He gets close enough to.\n\n<b>MILES (CONT&#x27;D)</b>\nI have been so scared for so long that I forgot it was a thing that could end.\n\nShe doesn&#x27;t look at him. But she doesn&#x27;t move away.\n\n<b>MILES (CONT&#x27;D)</b>\nI thought if I could just \u2014 hold it \u2014 for long enough\u2014\n\nHe raises his hand. Puts it on her arm, just above the elbow.\n\nShe lets him.\n\nTen seconds. Two people almost, almost getting back.\n\n<b>LIGHT.</b>\n\nThe pane, under the jacket, comes on so bright that the canvas glows from underneath.\n\nMiles pulls the jacket off.\n\n<b>ON THE PANE:</b>\n\nNo face. Black field. Four words in thin white type, wide-tracked, plain:\n\n**DO NOT GO BACK**\n\nLauren stares at it.\n\n<b>LAUREN</b>\n...Okay. That&#x27;s \u2014 that&#x27;s what you&#x27;ve been saying. That&#x27;s what you&#x27;ve been saying all night. Stay put. Do nothing. That&#x27;s *good*, isn&#x27;t it\u2014\n\nShe turns to him.\n\nMiles has taken a step back from the table.\n\nNot a flinch. A *retreat*. He has put distance between himself and four words on a screen and he is looking at them like they are a person in the room.\n\n<b>LAUREN (CONT&#x27;D)</b>\nMiles?\n\n<b>MILES</b>\nThat&#x27;s not advice.\n\n<b>LAUREN</b>\nWhat?\n\n<b>MILES</b>\nThat&#x27;s not somebody warning us. That&#x27;s not \u2014 Lauren, that&#x27;s *word for word*.\n\nShe looks at the screen. Then at him. And then she gets it, and it takes all the blood out of her too.\n\n<b>MILES (CONT&#x27;D)</b>\nThat&#x27;s clause three.\n\n<b>LAUREN</b>\n(whisper)\nSomebody over there is reading us our own Terms.\n\n<b>MILES</b>\nSomebody over there *has* them.\n\nBeneath the four words, small, precis   WARM:{a:'#3a2a1c',b:'#17100a',f:'#0d0906',k:'#c08a4e'},
  WARM_LOW:{a:'#281c13',b:'#0e0a07',f:'#080605',k:'#a8763f'},
  KITCHEN_OVERHEAD:{a:'#43301d',b:'#18110a',f:'#0c0805',k:'#dda964'},
  COLD_PANE:{a:'#0f161d',b:'#04060a',f:'#080c10',k:'#8fa6b8'},
  MIXED:{a:'#33251a',b:'#0a0f14',f:'#0b0a09',k:'#c08a4e',k2:'#8fa6b8'},
  BLACKOUT:{a:'#0a0d11',b:'#020304',f:'#060709',k:'#39444f'},
  STREET_NIGHT:{a:'#151b26',b:'#07090e',f:'#0b0e13',k:'#b78d51'},
  TV_ONLY:{a:'#0d1219',b:'#050709',f:'#080b0e',k:'#7d94a6'},
  PALE_FLAT:{a:'#eceded',b:'#e2e4e6',f:'#c4c8cc',k:'#ffffff'},
  DEGRADED:{a:'#222426',b:'#060606',f:'#0b0b0b',k:'#cdc6b4'}
};
const SCALE = {XWIDE:.34,WIDE:.58,'WIDE-2S':.58,'WIDE-POV':.5,MED:.98,'MED-2S':.98,
  'MED-TRACK':.98,MCU:1.5,CU:2.3,'CU-2S':1.9};

function figure(cx, base, h, fill, op){
  const hr=h*.17, hcy=base-h+hr, w=h*.45;
  return `<g fill="${fill}" opacity="${op}"><ellipse cx="${cx.toFixed(1)}" cy="${hcy.toFixed(1)}" rx="${(hr*.82).toFixed(1)}" ry="${hr.toFixed(1)}"/>`
   + `<path d="M ${cx} ${(hcy+hr*.86).toFixed(1)} C ${(cx-w*.6).toFixed(1)} ${(hcy+hr*1.6).toFixed(1)} ${(cx-w).toFixed(1)} ${(base-h*.3).toFixed(1)} ${(cx-w).toFixed(1)} ${base.toFixed(1)} L ${(cx+w).toFixed(1)} ${base.toFixed(1)} C ${(cx+w).toFixed(1)} ${(base-h*.3).toFixed(1)} ${(cx+w*.6).toFixed(1)} ${(hcy+hr*1.6).toFixed(1)} ${cx} ${(hcy+hr*.86).toFixed(1)} Z"/></g>`;
}
function faceOnPane(){ /* the double: a face held in the pane, still, scarred */
  return `<g><ellipse cx="500" cy="250" rx="132" ry="168" fill="#1c242c"/>`
    +`<ellipse cx="500" cy="250" rx="132" ry="168" fill="url(#lowlight)"/>`
    +`<ellipse cx="452" cy="228" rx="15" ry="8" fill="#0a0e12"/>`
    +`<ellipse cx="548" cy="228" rx="15" ry="8" fill="#0a0e12"/>`
    +`<path d="M 470 316 Q 500 326 530 316" stroke="#0a0e12" stroke-width="4" fill="none" stroke-linecap="round"/>`
    +`<path d="M 444 252 L 414 268" stroke="#7e8f9c" stroke-width="2.4" opacity=".8" stroke-linecap="round"/></g>`;
}
function frameSVG(s){
  if(s.sc==='TITLE'||s.sc==='ENDCARD') return null;
  const p = PAL[s.look]||PAL.WARM_LOW, ins = s.fr.indexOf('INSERT')>=0;
  let o = `<defs>
    <radialGradient id="key" cx="${s.look==='COLD_PANE'?'50%':'32%'}" cy="${s.look==='KITCHEN_OVERHEAD'?'8%':'42%'}" r="70%">
      <stop offset="0%" stop-color="${p.k}" stop-opacity="${s.look==='PALE_FLAT'?.9:.36}"/>
      <stop offset="60%" stop-color="${p.a}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${p.b}" stop-opacity="0"/></radialGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${p.a}"/><stop offset="100%" stop-color="${p.b}"/></linearGradient>
    <radialGradient id="lowlight" cx="42%" cy="72%" r="76%">
      <stop offset="0%" stop-color="#5b7182" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".35"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="${s.look==='PALE_FLAT'?0:.72}"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="${s.look==='DEGRADED'?7:16}"/></filter>
    <filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer></filter></defs>
    <rect width="1000" height="500" fill="url(#grd)"/><rect width="1000" height="500" fill="url(#key)"/>`;

  if(s.loc==='EXT_STREET'){
    o += `<rect y="330" width="1000" height="170" fill="${p.b}" opacity=".9"/>`;
    for(let i=0;i<5;i++){ const x=40+i*205, lit = s.look==='STREET_NIGHT';
      o += `<rect x="${x}" y="${196+(i%2)*14}" width="150" height="${146-(i%2)*14}" fill="${p.f}" opacity=".92"/>`;
      if(lit) o += `<rect x="${x+34}" y="${232+(i%2)*14}" width="42" height="36" fill="${i===2&&s.look==='BLACKOUT'?'#0a0d11':'#c9a066'}" opacity="${i===2&&s.note.indexOf('lights on')>=0?.08:.62}"/>`;
    }
  }
  if(s.loc==='MOTEL'){
    o += `<rect y="300" width="1000" height="200" fill="#0b0e13"/>
      <rect x="120" y="196" width="760" height="150" fill="#171b21"/>`;
    for(let i=0;i<8;i++) o += `<rect x="${150+i*92}" y="228" width="46" height="86" fill="#0a0d11"/>`;
    o += `<rect x="720" y="86" width="120" height="88" fill="#2a2a1e" stroke="#5f5a3a" stroke-width="2"/>
      <text x="780" y="140" text-anchor="middle" font-family="monospace" font-size="26" fill="#d9c07a">BLU RIDG</text>`;
  }
  if(s.loc==='PALE'){ o += `<rect x="240" y="330" width="520" height="24" fill="#cfd2d5"/>`; }

  /* the leaf */
  const bigPane = ins && (s.subj==='D' || s.dev);
  if(bigPane){
    o += `<rect x="118" y="34" width="764" height="432" fill="#05080b" stroke="#7f909e" stroke-width="2"/>`;
    if(s.subj==='D') o += faceOnPane();
    else if(s.action.indexOf('AN EYE')>=0)
      o += `<ellipse cx="500" cy="250" rx="290" ry="130" fill="#d8dde1"/>
            <ellipse cx="500" cy="250" rx="112" ry="112" fill="#4a6274"/>
            <ellipse cx="500" cy="250" rx="52" ry="52" fill="#06090c"/>
            <ellipse cx="466" cy="216" rx="20" ry="14" fill="#fff" opacity=".8"/>`;
    else if(s.action.indexOf('DO NOT GO BACK')>=0)
      o += `<text x="500" y="238" text-anchor="middle" font-family="Archivo,sans-serif" font-size="42" letter-spacing="12" fill="#eef1f4" font-weight="300">DO NOT GO BACK</text>`;
    else if(s.cd||s.action.indexOf('11:00')>=0)
      o += `<text x="500" y="270" text-anchor="middle" font-family="monospace" font-size="52" letter-spacing="6" fill="#c6d2dc">${esc(s.cd||'11:00')}</text>`;
    else o += `<rect x="118" y="34" width="764" height="432" fill="url(#lowlight)" opacity=".5"/>`;
  } else if(s.dev){
    const y = s.loc==='KITCHEN'?372:388;
    o += `<g><ellipse cx="500" cy="${y+16}" rx="190" ry="26" fill="${p.k}" opacity=".16" filter="url(#blur)"/>
      <path d="M 392 ${y-64} L 608 ${y-64} L 640 ${y} L 360 ${y} Z"
        fill="${s.look==='COLD_PANE'||s.look==='MIXED'?'#0d151c':'#0a0c0f'}"
        stroke="${s.look==='COLD_PANE'||s.look==='MIXED'?'#93a9ba':'#4b535b'}" stroke-width="2"/></g>`;
  }

  /* figures */
  if(!ins || s.subj==='FIG'){
    const sc = SCALE[s.fr]||.9, h = sc*500;
    const base = 500 + Math.max(0,(h-500)*.6);
    const fill = s.look==='PALE_FLAT'?'#b9bdc2':p.f;
    if(s.subj==='MB'){ o += figure(370,base,h,fill,.96) + figure(646,base,h*.97,fill,.96); }
    else if(s.subj==='FIG'){ o += figure(500,base,h*1.05,fill,.9); }
    else if(s.subj!=='NONE'&&s.subj!=='D'){ o += figure(s.fr.indexOf('2S')>=0?420:500,base,h,fill,.96); }
  }
  if(ins && !bigPane && s.subj==='NONE'){
    o += `<rect x="286" y="120" width="428" height="260" rx="2" fill="${s.look==='PALE_FLAT'?'#fdfdfd':'#cfc7b4'}" opacity=".9"/>
          <rect x="322" y="164" width="240" height="9" fill="#6d6759" opacity=".7"/>
          <rect x="322" y="196" width="330" height="9" fill="#6d6759" opacity=".45"/>
          <rect x="322" y="228" width="170" height="9" fill="#6d6759" opacity=".45"/>`;
  }
  o += `<rect width="1000" height="500" fill="url(#vig)"/><rect width="1000" height="500" filter="url(#gr)" opacity=".9"/>`;
  return `<svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${o}</svg>`;
}
function slate(s){
  const t1 = s.sc==='TITLE'?"WE&rsquo;RE FROM THE FUTURE":"WE&rsquo;RE FROM THE FUTURE";
  const t2 = s.sc==='TITLE'?'':'END OF EPISODE ONE';
  return `<div class="slate"><div class="t1">${t1}</div>${t2?`<div class="t2">${t2}</div>`:''}</div>`;
}
function paintStage(el, s, tNow){
  const svg = frameSVG(s);
  const cd = (CDZERO!==null && tNow>=CDFIRST.t && tNow<=CDZERO) ? clk(Math.max(0,CDZERO-tNow)) : null;
  const dlg = s.dlg && s.dlg.length ? s.dlg[0] : null;
  el.innerHTML = (svg||slate(s)) + `<div class="ovl">
    <div class="top"><span>${esc(s.id)} &middot; ${esc(s.fr)} &middot; ${s.lens?s.lens+'mm':'&mdash;'} &middot; ${esc(s.mv)}</span>
      <span>${esc(s.sc)} &middot; ${esc(s.act)}</span></div>
    <div class="bot">${dlg?`<div class="dlg"><b>${esc(dlg[0])}</b>${esc(dlg[1])}</div>`:''}</div>
  </div>` + (cd?`<div class="cdw">${cd}</div>`:'');
}
</script>

<script>
/* ---------------- sections ---------------- */
const NAV = [
  ['nav1','overview','Episode Overview',''],
  ['nav1','story','Story Room',''],
  ['nav1','chars','Characters','3'],
  ['nav2','world','World &amp; Assets',''],
  ['nav2','board','Storyboard',String(SH.length)],
  ['nav3','gen','Generate',String(SH.length)],
  ['nav3','timeline','Timeline Edit',''],
  ['nav3','continuity','Continuity',''],
  ['nav4','review','Review',''],
  ['nav4','export','Export',''],
];
const H = (k,t,p)=>`<div class="ph"><div class="k">${k}</div><h2>${t}</h2><p>${p}</p></div>`;
const tile=(l,v,s)=>`<div class="tile"><div class="lb">${l}</div><div class="vl">${v}</div><div class="sb">${s||''}</div></div>`;

function actBar(){
  return `<div class="actbar">`+ACTS.map(a=>`<div style="width:${a.d/TOTAL*100}%;background:${ACTC[a.act]||'#888'}" title="${a.act} &middot; ${clk(a.d)}">${a.d/TOTAL>.07?a.act.replace('ACT ',''):''}</div>`).join('')+`</div>`;
}

/* 1 -------------------------------------------------- overview */
function vOverview(){
  const dev=SH.filter(s=>s.dev).length, dbl=SH.filter(s=>s.subj==='D').length;
  const touch=SH.filter(s=>s.contact);
  return H('EPISODE OVERVIEW','The Package',
   'Season one, episode one. A couple who have spent six years hiding the fact that they are not from this century receive an unmarked package &mdash; and the face on the screen inside it is hers.')
  + `<div class="grid g4" style="margin-bottom:16px">
      ${tile('RUNTIME',E.runtime,'fine cut, 2.00:1 &middot; 24 fps')}
      ${tile('SHOTS',SH.length,'mean '+(TOTAL/SH.length).toFixed(1)+'s')}
      ${tile('SCENES',E.scenes.length,'one practical location')}
      ${tile('SCORED','27%','9m 40s of '+E.runtime)}
    </div>
    <div class="card" style="margin-bottom:16px"><h3>ACT STRUCTURE</h3>${actBar()}
      <div class="grid g4" style="margin-top:12px;gap:8px">${ACTS.map(a=>
        `<div style="font-size:11px"><span class="mono dim">${clk(a.t)}</span><br>
         <b style="font-weight:500">${a.act}</b><br><span class="dim">${a.n} shots &middot; ${clk(a.d)}</span></div>`).join('')}</div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>PRODUCTION STATUS</h3><dl class="dl">
        <dt>PHASE 1 &middot; BIBLE</dt><dd><span class="pill ok">COMPLETE</span></dd>
        <dt>PHASE 2 &middot; STORY</dt><dd><span class="pill ok">COMPLETE</span> 3 structures scored, option C selected</dd>
        <dt>PHASE 3 &middot; SCRIPT</dt><dd><span class="pill ok">v3.0 LOCKED</span> five revision passes run</dd>
        <dt>PHASE 4 &middot; PREVIS</dt><dd><span class="pill ok">COMPLETE</span> ${SH.length} shots boarded and timed</dd>
        <dt>PHASE 5 &middot; ASSETS</dt><dd><span class="pill ok">LOCKED</span> faces, wardrobe, props, continuity matrix</dd>
        <dt>PHASE 6 &middot; SHOTS</dt><dd><span class="pill hold">READY</span> every shot has a prompt, a negative and a seed</dd>
        <dt>PHASE 7 &middot; EDIT</dt><dd><span class="pill hold">EDL + SUBS ONLY</span> no picture to conform</dd>
        <dt>PHASE 8 &middot; QC</dt><dd><span class="pill ok">41/41 AUTOMATED</span> manual gate not cleared</dd>
      </dl></div>
      <div class="card"><h3>KEY WARNINGS</h3>
        <div class="note warn"><b>No picture exists.</b> This workspace was built in an
          environment with no image, video or speech generation. Every plan, prompt and
          timing below is real and executable; no frame has been rendered.</div>
        <div class="note"><b>Countdown is bound to the cut.</b> The leaf's clock reads
          <span class="mono">${CDFIRST.cd}</span> at <span class="mono">${clk(CDFIRST.t)}</span>
          and reaches <span class="mono">00:00</span> at <span class="mono">${clk(CDZERO)}</span>,
          on the knock. The build fails if that drifts.</div>
        <div class="note"><b>Contact discipline: ${touch.length} touches.</b>
          ${touch.map(t=>`<span class="mono">${clk(t.t)}</span>`).join(' &middot; ')} &mdash; and the last is the final shot.</div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3>THE HOUR IN ONE LINE</h3>
      <p style="font-size:16px;max-width:60ch;color:var(--tx)">The cost of an ordinary life is that somebody else paid for it.</p>
      <p class="dim" style="margin:0">Miles has been breaking clause five &mdash; nine words, once a year, to tell someone they are alive. The package is dated to that same day. It is not a delivery. It is a reply.</p>
    </div>`;
}

/* 2 -------------------------------------------------- story room */
const PLANTS=[['P1','Four bare picture hooks in the hallway','Teaser','Act Three &mdash; clause two, inside an argument'],
['P2','Miles turns his face away from a camera','Teaser','Act Four &mdash; a photograph nobody took'],
['P3','Lauren starts to cross a seven, and stops','Teaser','Act One &mdash; the seven on the label is crossed'],
['P4','He calls the film&rsquo;s ending three seconds early','Teaser','He has seen everything already'],
['P5','The smoke detector chirps','Teaser','Act Four &mdash; the living room chirps back, half a beat late'],
['P6','Miles checks one sightline down the street','Teaser','Act Four &mdash; the figure stands in exactly that spot'],
['P7','One circled date, nothing written in it','Teaser','Act Three &mdash; it is the day he sends'],
['P9','&ldquo;We&rsquo;re not from around here&rdquo;','Teaser','Title drop, sideways, as a joke about neighbours'],
['P10','The pane&rsquo;s reflection lags half a second','Act One','Never explained. It is not a screen; it is a window.']];
const LEDGER=[['Where they are from','HELD','Never. Protected in-world: they are forbidden to say the year.'],
['Who sent the leaf','HELD','&ldquo;Somebody over there&rdquo; is as far as it goes.'],
['What the double is','NARROWED','She claims to be the version who complied. Nothing corroborates her.'],
['Who Miles writes to','ANSWERED BY A VOICE','Two syllables at the door. Never a name.'],
['Why Lauren&rsquo;s voice','HELD','She asks. The transmission breaks on the answer.'],
['What the countdown counts to','ANSWERED','By an image, in the last thirty seconds &mdash; and it opens two worse questions.'],
['What Lauren does not remember','NEWLY OPENED','Replaces the spent mystery in the same scene.'],
['Lauren&rsquo;s real name','OPENED, WITHHELD','A half-second hole in the audio bed.'],
['Why her file predates his','OPENED','Nineteen years. Unexplained.']];
function vStory(){
  return H('STORY ROOM','Beats, mysteries and the page',
   'The beat sheet is generated from the same timeline as the cut, so a scene cannot exist here and not exist in the edit.')
  + `<div class="grid g2"><div class="card"><h3>PLANTS AND PAYOFFS</h3>
      <div class="tblw" style="border:0"><table><thead><tr><th>#</th><th>Planted</th><th>Where</th><th>Paid</th></tr></thead><tbody>
      ${PLANTS.map(p=>`<tr><td class="m">${p[0]}</td><td>${p[1]}</td><td class="m">${p[2]}</td><td class="dim">${p[3]}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><h3>MYSTERY TRACKER</h3>
      <div class="tblw" style="border:0"><table><thead><tr><th>Question</th><th>State</th></tr></thead><tbody>
      ${LEDGER.map(l=>`<tr><td>${l[0]}<div class="dim" style="font-size:11.5px">${l[2]}</div></td>
        <td><span class="pill ${l[1].indexOf('HELD')>=0?'cold':(l[1].indexOf('ANSWER')>=0?'warm':'hold')}">${l[1]}</span></td></tr>`).join('')}
      </tbody></table></div></div></div>
    <h3 style="margin:26px 0 10px;font-size:12px;letter-spacing:.14em;color:var(--tx-3)">SCENE BREAKDOWN</h3>
    <div class="tblw"><table><thead><tr><th>Scene</th><th>Act</th><th>In</th><th>Dur</th><th>Shots</th><th>Slugline</th></tr></thead><tbody>
    ${E.scenes.map(sc=>{const g=SH.filter(s=>s.sc===sc.id); if(!g.length)return'';
      return `<tr><td class="m">${sc.id}</td><td class="dim">${sc.act}</td><td class="m">${clk(g[0].t)}</td>
      <td class="m">${clk(g.reduce((a,b)=>a+b.d,0))}</td><td class="m">${g.length}</td><td class="m">${esc(sc.slug)}</td></tr>`;}).join('')}
    </tbody></table></div>
    <h3 style="margin:26px 0 10px;font-size:12px;letter-spacing:.14em;color:var(--tx-3)">SCREENPLAY &mdash; v3.0 LOCKED</h3>
    <div class="script"><pre id="scriptBody"></pre></div>`;
}

/* 3 -------------------------------------------------- characters */
const CHARS=[
 {id:'CHR-MILES-01',n:'MILES WARD',a:'28&ndash;31',w:'WRD-M-A &rarr; WRD-M-B',
  look:'Short tousled warm-auburn hair. Full dark brows. Blue-grey eyes with a hazel inner ring &mdash; the left reads marginally smaller when he smiles. A two-week unshaped beard, redder than his hair. Natural flush across the cheeks.',
  body:'Stillness. When he is frightened he becomes <em>more</em> still, not less. His hands go quiet before he lies. He places himself between Lauren and any door, window or object of interest &mdash; in nine scenes, never remarked on.',

  arc:'calm control &rarr; denial &rarr; management &rarr; exposure &rarr; protective panic &rarr; surrender',
  th:'His lie is not cowardice. It is tenderness that went bad in storage.'},
 {id:'CHR-LAUREN-01',n:'LAUREN WARD',a:'27&ndash;30',w:'WRD-L-A &rarr; WRD-L-B',
  look:'Neutral blonde, darker at the root, in a low imperfect ponytail with loose pieces at both temples. Defined taupe brows. Large blue-green eyes. Black velvet choker and fine gold pendant chains. Minimal, worn-in makeup.',
  body:'Tactile. She meets the world with her hands and touches the box before she reads it. Under stress she gets closer, not further. When she is hurt she stops moving entirely.',
  voice:'Mid, warm, quick, musical. She has the only shout in the episode and it lasts one line. She sounds native; he does not. She adapted better, and that is a plot point.',
  arc:'at home &rarr; unease &rarr; recognition &rarr; fury &rarr; grief &rarr; resolve',
  th:'Her anger is not "you lied." It is "you decided which of us got to be ready."'},
 {id:'CHR-LAUREN-02',n:'THE DOUBLE',a:'the same',w:'WRD-D-A',

function vChars(){

function vTimeline(){
  const lane=(items,col)=>items.map(i=>`<i style="left:${i.t/TOTAL*100}%;width:${Math.max(.08,i.d/TOTAL*100)}%;background:${col(i)}" title="${esc(i.title)}">${i.lab||''}</i>`).join('');

    else if(s.music) mus.push({t:s.t,d:s.d,cue:s.music,title:s.music+' '+(E.cues[s.music]||{}).name});});

      <div class="trow"><div class="lb">A2 MUSIC</div><div class="tlane">${lane(mus,i=>(E.cues[i.cue]||{}).desc?.indexOf('silence')>=0?'#3d4750':'#8FA6B8')}</div></div>

          <td>${silent?'<span class="pill">SCORE OUT</span>':'<span class="mono dim">'+n+' shots</span>'}</td></tr>`;}).join('')}
      </tbody></table></div></div>

        <div class="note">The three biggest turns play dry: the eye, &ldquo;you got an answer,&rdquo; and the knock.</div>
        <div class="note">The score ends before the episode does. There is no music from the knock to the end card.</div>

    ${alerts.length?`<div class="note warn"><b>${alerts.length} continuity conflicts.</b> ${alerts.map(a=>a[0]).join(', ')}</div>`
      :`<div class="note"><b>No continuity conflicts detected.</b> 41 of 41 automated checks passing. The manual gate &mdash; face lock, eyelines, hands, lip-sync, mix &mdash; cannot be cleared without picture.</div>`}
    <div class="bar" style="margin-top:16px"><input type="search" id="cq" placeholder="Filter by shot, scene or wardrobe&hellip;" style="min-width:300px"><span class="dim mono" id="ccount"></span></div>

<script>
/* 9 -------------------------------------------------- review: the animatic */
let T=0, playing=false, last=0, rate=1, curIdx=-1;
function shotAt(t){ let lo=0,hi=SH.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1; if(SH[m].t<=t) lo=m; else hi=m-1;} return lo; }
function vReview(){
  return H('REVIEW','Animatic',
   `The full ${E.runtime} cut, playing in real time from the shot database. Every frame is composed from that shot&rsquo;s own metadata, cut on its own duration, with its dialogue, its sound cue and &mdash; from ${clk(CDFIRST.t)} &mdash; the leaf&rsquo;s countdown running live against the picture.`)
  + `<div class="stage" id="stage"></div>
    <div class="transport">
      <button class="tp" id="bBack" title="Previous shot" aria-label="Previous shot">&#9668;&#9612;</button>
      <button class="tp" id="bPlay" title="Play or pause" aria-label="Play or pause">&#9654;</button>
      <button class="tp" id="bFwd" title="Next shot" aria-label="Next shot">&#9612;&#9658;</button>
      <div class="scrub" id="scrub" role="slider" aria-label="Timeline" tabindex="0"
           aria-valuemin="0" aria-valuemax="${Math.round(TOTAL)}" aria-valuenow="0">
        <div class="acts">${ACTS.map(a=>`<i style="width:${a.d/TOTAL*100}%;background:${ACTC[a.act]}"></i>`).join('')}</div>
        <div class="cdz" style="left:${CDFIRST.t/TOTAL*100}%"></div>
        <div class="cdz" style="left:${CDZERO/TOTAL*100}%"></div>
        <div class="pg" id="pg" style="left:0"></div>
      </div>
      <div class="tcread" id="tcread">00:00 / ${E.runtime}</div>
      <select id="rate"><option value="1">1&times;</option><option value="2">2&times;</option>
        <option value="4">4&times;</option><option value="8">8&times;</option></select>
    </div>
    <div class="bar" style="margin-top:10px">${ACTS.filter(a=>a.n>2).map(a=>
      `<button class="btn" data-jump="${a.t}">${a.act} <span class="mono dim">${clk(a.t)}</span></button>`).join('')}</div>
    <div class="grid g2" style="margin-top:6px">
      <div class="card"><h3>THIS SHOT</h3><div id="nowMeta"></div></div>
      <div class="card"><h3>NEXT</h3><div id="nextMeta"></div></div>
    </div>`;
}
function meta(s){ if(!s) return '<p class="dim">End of episode.</p>';
  return `<dl class="dl">
    <dt>SHOT</dt><dd class="mono">${s.id} &middot; ${s.sc} &middot; ${s.d}s</dd>
    <dt>CAMERA</dt><dd class="mono">${esc(s.fr)} &middot; ${esc(s.mv)} &middot; ${s.lens?s.lens+'mm':'&mdash;'}</dd>
    <dt>LIGHT</dt><dd class="mono">${esc(s.look)}</dd>
    ${s.action?`<dt>ACTION</dt><dd>${esc(s.action)}</dd>`:''}
    ${s.dlg.length?`<dt>DIALOGUE</dt><dd>${s.dlg.map(d=>`<b>${esc(d[0])}</b> ${esc(d[1])}`).join('<br>')}</dd>`:''}
    ${s.audio?`<dt>SOUND</dt><dd class="dim">${esc(s.audio)}</dd>`:''}
    ${s.music?`<dt>MUSIC</dt><dd class="mono">${s.music} ${esc((E.cues[s.music]||{}).name||'')}</dd>`:''}
    ${s.note?`<dt>NOTE</dt><dd style="color:var(--tx)">${esc(s.note)}</dd>`:''}
  </dl>`; }
function paintNow(force){
  const i=shotAt(T);
  if(i!==curIdx||force){ curIdx=i; paintStage($('#stage'),SH[i],T);
    $('#nowMeta').innerHTML=meta(SH[i]); $('#nextMeta').innerHTML=meta(SH[i+1]); }
  else { const cd=(T>=CDFIRST.t&&T<=CDZERO)?clk(Math.max(0,CDZERO-T)):null;
    const w=$('.cdw',$('#stage')); if(w&&cd) w.textContent=cd; }
  $('#pg').style.left=(T/TOTAL*100)+'%';
  $('#tcread').textContent=`${clk(T)} / ${E.runtime}`;
  $('#scrub').setAttribute('aria-valuenow',Math.round(T));
}
function seek(t){ T=Math.max(0,Math.min(TOTAL-.01,t)); if(view==='review') paintNow(true); }
function tick(ts){ if(!playing) return;
  if(!last) last=ts; const dt=(ts-last)/1000; last=ts; T+=dt*rate;
  if(T>=TOTAL){ T=TOTAL-.01; playing=false; $('#bPlay').innerHTML='&#9654;'; }
  paintNow(); requestAnimationFrame(tick); }
function wireReview(){
  $('#bPlay').onclick=()=>{ playing=!playing; last=0;
    $('#bPlay').innerHTML=playing?'&#10074;&#10074;':'&#9654;'; if(playing) requestAnimationFrame(tick); };
  $('#bBack').onclick=()=>seek(SH[Math.max(0,shotAt(T)-(T-SH[shotAt(T)].t<.6?1:0))].t+.01);
  $('#bFwd').onclick=()=>seek((SH[shotAt(T)+1]||SH[SH.length-1]).t+.01);
  $('#rate').onchange=e=>rate=+e.target.value;
  const sc=$('#scrub');
  const grab=e=>{const r=sc.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL);};
  sc.onpointerdown=e=>{sc.setPointerCapture(e.pointerId);grab(e);sc.onpointermove=grab;};
  sc.onpointerup=()=>{sc.onpointermove=null;};
  sc.onkeydown=e=>{ if(e.key==='ArrowRight'){seek(T+5);e.preventDefault();}
    if(e.key==='ArrowLeft'){seek(T-5);e.preventDefault();} };
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>seek(+b.dataset.jump+.01));
  paintNow(true);
}

 ['Production bible','production/01-bible/','md','READY'],

 ['Revision passes &mdash; five, documented','production/03-script/revision-passes.md','md','READY'],
 ['Storyboard','production/04-previs/storyboard.md','md','GENERATED'],
 ['Shot list','production/04-previs/shot-list.csv','csv','GENERATED'],
 ['Animatic timing data','production/04-previs/animatic.json','json','GENERATED'],
 ['Fine cut trim log','production/04-previs/trim-log.md','md','GENERATED'],
 ['Lookbook','production/05-assets/lookbook.md','md','READY'],
 ['Location and prop bible','production/05-assets/locations-and-props.md','md','READY'],

function vExport(){
  return H('EXPORT','What exists, and what does not',
   'An honest manifest. Everything in the first table is a real file in the repository. Everything in the second requires a capability this environment does not have.')
  + `<div class="grid g4" style="margin-bottom:16px">
      ${tile('DELIVERED',String(DELIV.length),'files in the repository')}
      ${tile('BLOCKED',String(BLOCKED.length),'need a model not attached here')}
      ${tile('QC','41/41','automated checks passing')}
      ${tile('RUNTIME',E.runtime,'within the 28&ndash;38 min brief')}</div>
    <div class="tblw" style="margin-bottom:18px"><table><thead><tr><th>Deliverable</th><th>Path</th><th>Format</th><th>State</th></tr></thead><tbody>
    ${DELIV.map(d=>`<tr><td>${d[0]}</td><td class="m dim">${d[1]}</td><td class="m">${d[2]}</td>
      <td><span class="pill ${d[3]==='DELIVERED'?'ok':'hold'}">${d[3]}</span></td></tr>`).join('')}
    </tbody></table></div>
    <h3 style="margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--bad)">NOT PRODUCED</h3>
    <div class="tblw"><table><thead><tr><th>Deliverable</th><th>Why not</th></tr></thead><tbody>
    ${BLOCKED.map(b=>`<tr><td>${b[0]}</td><td class="dim">${b[1]}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note warn" style="margin-top:16px"><b>Nothing here is a rendered frame.</b>
      The animatic in Review is drawn procedurally from the shot records. It is a previs
      board with correct timing, not a film. Read it as a plan that can be executed, and
      the plan is complete.</div>`;
}

/* ---------------- app ---------------- */
let view='overview';
const RENDER={overview:vOverview,story:vStory,chars:vChars,world:vWorld,board:vBoard,
              gen:vGen,timeline:vTimeline,continuity:vContinuity,review:vReview,export:vExport};
function go(v){
  view=v; playing=false; last=0;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===v)));
  const el=document.getElementById('v-'+v); el.classList.add('on'); el.innerHTML=RENDER[v]();
  if(v==='story') $('#scriptBody').innerHTML=SCRIPT_HTML;
  if(v==='board'){ paintBoard(); $('#bq').oninput=paintBoard; $('#bact').onchange=paintBoard; }
  if(v==='gen'){ paintGen(); $('#gq').oninput=paintGen; }
  if(v==='continuity'){ paintCont(); $('#cq').oninput=paintCont; }
  if(v==='review') wireReview();
  window.scrollTo(0,0);
}
NAV.forEach(([grp,v,label,ct])=>{
  const b=document.createElement('button'); b.dataset.v=v;
  b.innerHTML=`<span>${label}</span>${ct?`<span class="ct">${ct}</span>`:''}`;
  b.onclick=()=>go(v); document.getElementById(grp).appendChild(b);
});

$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const next=cur? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('wfft-theme',next);}catch(e){}
};
try{const t=localStorage.getItem('wfft-theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}
go('overview');
