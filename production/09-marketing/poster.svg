<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100">
  <defs>
    <!-- the panel's light -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b9c4cc" stop-opacity="0.92"/>
      <stop offset="45%"  stop-color="#8e9aa4" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#5d6873" stop-opacity="0.78"/>
    </linearGradient>
    <!-- warm spill from the streetlight beyond the door -->
    <radialGradient id="spill" cx="50%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#6d6250" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#2a2a30" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a0b0d"/>
      <stop offset="18%"  stop-color="#121418"/>
      <stop offset="50%"  stop-color="#15181d"/>
      <stop offset="82%"  stop-color="#111317"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="62%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.97"/>
    </linearGradient>

    <!-- the shape behind the glass: heavily diffused, never resolving -->
    <filter id="frost" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="frostSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <!-- frosted texture -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
    </filter>
    <filter id="glassTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.008" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="panelClip"><rect x="392" y="300" width="616" height="880" rx="3"/></clipPath>
  </defs>

  <!-- ground -->
  <rect width="1400" height="2100" fill="#050608"/>
  <rect width="1400" height="2100" fill="url(#door)"/>
  <rect width="1400" height="2100" fill="url(#spill)"/>

  <!-- door stiles: implied, never drawn hard -->
  <rect x="352" y="252" width="696" height="976" fill="#0b0c0f" opacity="0.85"/>
  <rect x="368" y="270" width="664" height="940" fill="#101216"/>

  <!-- the frosted panel -->
  <g clip-path="url(#panelClip)">
    <rect x="392" y="300" width="616" height="880" fill="url(#glass)"/>
    <g filter="url(#glassTexture)">
      <!-- the figure: head and shoulders, never resolving -->
      <g filter="url(#frost)" opacity="0.66">
        <ellipse cx="700" cy="720" rx="97" ry="122" fill="#1c1f24"/>
        <path d="M 700 830 C 605 838 545 900 528 1000 L 528 1180 L 872 1180 L 872 1000 C 855 900 795 838 700 830 Z" fill="#1c1f24"/>
      </g>
      <g filter="url(#frostSoft)" opacity="0.42">
        <ellipse cx="700" cy="716" rx="118" ry="140" fill="#14171b"/>
      </g>
    </g>
    <!-- a raised hand, barely there, at the height of a knock -->
    <g filter="url(#frostSoft)" opacity="0.3">
      <ellipse cx="856" cy="905" rx="40" ry="52" fill="#191c21"/>
    </g>
    <rect x="392" y="300" width="616" height="880" fill="url(#fade)" opacity="0.35"/>
    <rect x="392" y="300" width="616" height="880" filter="url(#grain)"/>
  </g>
  <rect x="392" y="300" width="616" height="880" fill="none" stroke="#2b3038" stroke-width="2"/>
  <rect x="386" y="294" width="628" height="892" fill="none" stroke="#000" stroke-width="10" opacity="0.5"/>

  <!-- vignette down to the type -->
  <rect width="1400" height="2100" fill="url(#fade)"/>

  <!-- tagline -->
  <text x="700" y="1452" text-anchor="middle" fill="#c9ced4"
        font-family="FreeSans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="16" opacity="0.9">IT&#8217;S ME.</text>

  <!-- title -->
  <text x="700" y="1636" text-anchor="middle" fill="#eef1f4"
        font-family="FreeSans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="70" font-weight="300" letter-spacing="17">WE&#8217;RE FROM</text>
  <text x="700" y="1722" text-anchor="middle" fill="#eef1f4"
        font-family="FreeSans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="70" font-weight="300" letter-spacing="17">THE FUTURE</text>

  <line x1="560" y1="1792" x2="840" y2="1792" stroke="#3a4048" stroke-width="1.5"/>

  <text x="700" y="1848" text-anchor="middle" fill="#8b929b"
        font-family="FreeSans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="23" letter-spacing="11">SEASON ONE &#183; EPISODE ONE</text>
  <text x="700" y="1904" text-anchor="middle" fill="#c2c8cf"
        font-family="FreeSans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="31" letter-spacing="14">THE PACKAGE</text>

  <text x="700" y="1986" text-anchor="middle" fill="#666d76"
        font-family="FreeSans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="17" letter-spacing="6">THEY HAVE BEEN HERE SIX YEARS. SOMEBODY JUST WROTE BACK.</text>

  <rect width="1400" height="2100" filter="url(#grain)" opacity="0.85"/>
</svg>
